<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dodo AI chat</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Marked.js untuk memformat markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col font-sans antialiased">

    <!-- Header Navbar -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/60 backdrop-blur-md px-6 py-4 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/25">
                D
            </div>
            <div>
                <h1 class="font-semibold text-sm tracking-wide text-zinc-100">dodo AI chat</h1>
                <p class="text-[11px] text-zinc-400">Powered by Gemini</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-zinc-300 font-medium">Online</span>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl mx-auto w-full scroll-smooth">
        <!-- Message awal dari AI -->
        <div class="flex gap-3 sm:gap-4 max-w-[85%]">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xs shrink-0 font-bold">
                AI
            </div>
            <div class="bg-zinc-900 border border-zinc-800/80 p-4 rounded-2xl text-sm leading-relaxed text-zinc-200 shadow-sm prose prose-invert max-w-none">
                Halo! Ada yang bisa saya bantu hari ini?
            </div>
        </div>
    </main>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden max-w-4xl mx-auto w-full px-6 pb-3">
        <div class="flex items-center gap-2.5 text-zinc-400 text-xs font-medium">
            <i class="fa-solid fa-circle-notch animate-spin text-indigo-500"></i>
            <span>dodo AI sedang mengetik...</span>
        </div>
    </div>

    <!-- Input Form Area -->
    <footer class="p-4 border-t border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md">
        <div class="max-w-4xl mx-auto">
            <form id="chat-form" class="relative flex items-center">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Tulis pesanmu di sini... (Tekan Enter)" 
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-3.5 pl-4 pr-12 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    class="absolute right-2.5 p-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 active:scale-95 transition text-xs flex items-center justify-center w-8 h-8 shadow-md shadow-indigo-600/30"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            <p class="text-[10px] text-center text-zinc-600 mt-2">dodo AI chat v1.0</p>
        </div>
    </footer>

    <!-- Client-side Logic (JavaScript) -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const loading = document.getElementById('loading');

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // 1. Tampilkan pesan User
            appendMessage(message, 'user');
            userInput.value = '';

            // 2. Tampilkan loading
            loading.classList.remove('hidden');
            scrollToBottom();

            try {
                // 3. Request ke API Flask
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                loading.classList.add('hidden');

                if (data.reply) {
                    appendMessage(data.reply, 'ai');
                } else {
                    appendMessage('Terjadi kesalahan: ' + data.error, 'error');
                }
            } catch (err) {
                loading.classList.add('hidden');
                appendMessage('Gagal terhubung ke server.', 'error');
            }
            
            scrollToBottom();
        });

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            
            if (sender === 'user') {
                wrapper.className = 'flex gap-3 max-w-[85%] ml-auto justify-end';
                wrapper.innerHTML = `
                    <div class="bg-indigo-600 text-white p-4 rounded-2xl text-sm leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else if (sender === 'ai') {
                const parsedText = marked.parse(text);
                
                wrapper.className = 'flex gap-3 sm:gap-4 max-w-[85%]';
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xs shrink-0 font-bold">
                        AI
                    </div>
                    <div class="bg-zinc-900 border border-zinc-800/80 p-4 rounded-2xl text-sm leading-relaxed text-zinc-200 shadow-sm prose prose-invert max-w-none">
                        ${parsedText}
                    </div>
                `;
            } else {
                wrapper.className = 'flex gap-3 max-w-[85%]';
                wrapper.innerHTML = `
                    <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-4 rounded-2xl text-sm">
                        ${escapeHtml(text)}
                    </div>
                `;
            }

            chatBox.appendChild(wrapper);
            scrollToBottom();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
